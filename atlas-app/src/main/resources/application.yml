server:
  port: 8080

spring:
  application:
    name: atlas-erp

  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas_erp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: AtlasHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas:
      - public
      - plt_org
      - plt_iam
      - plt_doc
      - plt_aud
      - plt_cfg
      - fin
      - prc
      - sls
      - inv

  jooq:
    sql-dialect: Postgres

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
